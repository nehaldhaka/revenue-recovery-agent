<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Queue · Revenue Recovery Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1526;
    --bg: #EFF2F7;
    --card: #FFFFFF;
    --line: #E6E9F0;
    --ink: #141A2A;
    --muted: #7B879C;
    --muted-2: #9AA5B8;
    --blue: #2F62E8;
    --blue-soft: rgba(47,98,232,.10);
    --green: #1FA971;
    --green-soft: rgba(31,169,113,.12);
    --amber: #E39A2D;
    --amber-soft: rgba(227,154,45,.14);
    --red: #D2495A;
    --red-soft: rgba(210,73,90,.12);
    --purple: #8B5CF6;
    --purple-soft: rgba(139,92,246,.14);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,26,42,.04), 0 10px 30px -12px rgba(20,26,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .app-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--navy);
  }
  .brand { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
  .brand b { color: var(--blue); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2F62E8, #6B4CE0);
    color: #fff; font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; justify-content: center;
  }
  .logout-btn {
    background: transparent; border: 1px solid rgba(255,255,255,.15);
    color: #9AAAC7; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .logout-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }

  .app-body { display: flex; background: var(--bg); min-height: calc(100vh - 63px); }
  .app-sidebar {
    width: 210px; flex: none; background: var(--navy);
    padding: 16px 12px 20px; display: flex; flex-direction: column; gap: 2px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 9px; color: #93A0B8; font-size: 13.5px; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  .nav-item.active { background: var(--blue); color: #fff; }
  .nav-item svg { width: 16px; height: 16px; flex: none; }

  .app-main { flex: 1; padding: 24px 26px 40px; min-width: 0; }
  .main-head h2 { font-size: 22px; margin: 0 0 3px; font-weight: 800; letter-spacing: -.01em; }
  .main-head .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  .content-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .content-row { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px;
  }
  .panel-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .count-chip {
    background: var(--amber-soft); color: var(--amber); font-weight: 700;
    font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
  }
  .pill-btn {
    background: #fff; border: 1px solid var(--line); padding: 7px 12px; border-radius: 9px;
    font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .pill-btn:hover { border-color: var(--blue); color: var(--blue); }
  .pill-btn:disabled { opacity: .6; cursor: progress; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filter-chip {
    background: #F4F6FA; border: 1px solid var(--line); color: var(--muted);
    font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 20px; cursor: pointer;
  }
  .filter-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .queue-list { padding: 4px; max-height: 720px; overflow-y: auto; }
  .queue-empty { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

  .case-card { border: 1px solid var(--line); border-radius: 10px; margin: 8px; background: #FBFCFE; overflow: hidden; }
  .case-card.flagged { border-color: rgba(210,73,90,.35); border-left: 3px solid var(--red); background: #FDF8F8; }

  /* Compact header row — always visible, click to expand */
  .case-header {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    cursor: pointer; user-select: none;
  }
  .case-header:hover { background: rgba(47,98,232,.04); }
  .case-chevron {
    flex: none; width: 14px; height: 14px; color: var(--muted-2);
    transition: transform .15s ease;
  }
  .case-card.open .case-chevron { transform: rotate(90deg); }
  .case-header-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case-txn { font-family: 'JetBrains Mono'; font-size: 12.5px; font-weight: 700; flex: none; }
  .case-amount { font-size: 12.5px; color: var(--muted); flex: none; }
  .case-reason-inline { font-size: 12px; color: var(--ink); flex: 1; min-width: 120px; }
  .case-reason-inline b { color: var(--red); font-weight: 600; }
  .case-conf-inline { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--muted-2); flex: none; }

  .case-badges { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  .source-badge {
    display: inline-flex; align-items: center; font-family: 'JetBrains Mono';
    font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .03em;
    padding: 3px 8px; border-radius: 6px; background: #EEF1F6; color: var(--muted);
  }
  .source-badge.hard_guardrail { background: #EEF1F6; color: var(--muted-2); }
  .source-badge.mock_llm { background: #EEF1F6; color: var(--muted-2); }
  .source-badge.llm { background: var(--blue-soft); color: var(--blue); }
  .source-badge.ev_optimizer { background: var(--green-soft); color: var(--green); }
  .source-badge.bandit { background: var(--purple-soft); color: var(--purple); }
  .source-badge.circuit_breaker { background: var(--amber-soft); color: var(--amber); }
  .source-badge.fraud_guard { background: var(--red-soft); color: var(--red); }
  .source-badge.seed_script { background: #F0EEFA; color: #7C6FDB; }

  /* Expandable body — hidden until the card is opened */
  .case-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .case-card.open .case-body { display: block; padding-top: 12px; }
  .case-reasoning { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .case-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .case-form select {
    background: #fff; border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; font-family: 'JetBrains Mono'; font-size: 11.5px;
  }
  .case-form button {
    background: var(--blue); color: #fff; border: none; border-radius: 7px;
    padding: 7px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .case-form button:hover { filter: brightness(1.08); }
  .case-form button:disabled { opacity: .6; cursor: progress; }
  .toast { font-size: 11.5px; }
  .toast.error { color: var(--red); font-weight: 600; }
  .toast.ok { color: var(--green); font-weight: 600; }

  .drift-stat-row { display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .drift-stat-row:last-child { border-bottom: none; }
  .drift-stat-row .k { color: var(--muted); }
  .drift-stat-row .v { font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    text-align: left; padding: 8px 16px; color: var(--muted-2); font-weight: 700;
    text-transform: uppercase; font-size: 10px; letter-spacing: .04em; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 8px 16px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  .drift-bar-track { height: 6px; border-radius: 4px; background: #EEF1F6; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; }
  .drift-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--amber), var(--red)); }

  .bandit-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .action-pill { font-size: 10.5px; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
  .action-pill.RETRY_NOW { background: var(--green-soft); color: var(--green); }
  .action-pill.RETRY_DELAYED, .action-pill.RETRY_LATER { background: var(--blue-soft); color: var(--blue); }
  .action-pill.NUDGE_CUSTOMER, .action-pill.NUDGE { background: var(--amber-soft); color: var(--amber); }
  .action-pill.ESCALATE_TO_HUMAN, .action-pill.ESCALATE { background: var(--blue-soft); color: var(--blue); }
  .action-pill.STOP { background: var(--red-soft); color: var(--red); }
  .bandit-rate-bar { display: flex; align-items: center; gap: 8px; }
  .bandit-rate-track { flex: 1; height: 6px; border-radius: 4px; background: #EEF1F6; overflow: hidden; min-width: 50px; }
  .bandit-rate-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--purple), #B794F6); }
</style>
</head>
<body>

<div class="app-topbar">
  <div class="brand">Flow<b>Recover</b></div>
  <div class="topbar-right">
    <div class="avatar" id="avatarInitials">--</div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="app-body">
  <div class="app-sidebar">
    <a class="nav-item" href="/dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Control Room
    </a>
    <a class="nav-item" href="/audit-trail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      Audit Trail
    </a>
    <a class="nav-item active" href="/review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Review Queue
    </a>
  </div>

  <div class="app-main">
    <div class="main-head">
      <h2>Review Queue</h2>
    </div>

    <div class="content-row">
      <div class="panel">
        <div class="panel-head">
          <h3>Needs review</h3>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="count-chip" id="queueCount">0 pending</span>
            <button class="pill-btn" id="toggleAllBtn" onclick="toggleAllCards()">Expand all</button>
          </div>
        </div>
        <div class="filter-bar" id="filterBar">
          <span class="filter-chip active" data-source="" onclick="setFilter('')">All</span>
          <span class="filter-chip" data-source="hard_guardrail" onclick="setFilter('hard_guardrail')">Low confidence</span>
          <span class="filter-chip" data-source="fraud_guard" onclick="setFilter('fraud_guard')">Fraud flagged</span>
          <span class="filter-chip" data-source="circuit_breaker" onclick="setFilter('circuit_breaker')">Circuit breaker</span>
          <span class="filter-chip" data-source="seed_script" onclick="setFilter('seed_script')">Seed data</span>
        </div>
        <div class="queue-list" id="queueList">
          <div class="queue-empty">Loading…</div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="panel">
          <div class="panel-head">
            <h3>Model drift</h3>
            <button class="pill-btn" onclick="loadDriftStats()">Refresh</button>
          </div>
          <div id="statsBody">
            <div class="drift-stat-row"><span class="k">Loading…</span><span class="v"></span></div>
          </div>
          <table id="driftTable" style="display:none;">
            <thead><tr><th>Day</th><th>Reviewed</th><th>Overridden</th><th>Rate</th></tr></thead>
            <tbody id="driftBody"></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Bandit learning</h3>
            <button class="pill-btn" onclick="loadBanditArms()">Refresh</button>
          </div>
          <div id="banditBody">
            <div class="bandit-empty">Loading…</div>
          </div>
          <table id="banditTable" style="display:none;">
            <thead><tr><th>Action</th><th>Reason</th><th>Amt</th><th>Rate</th><th>N</th></tr></thead>
            <tbody id="banditBodyRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ===== AUTH =====
  (function () {
    const name = localStorage.getItem('rra_operator');
    if (!name) {
      window.location.href = '/dashboard';
      return;
    }
    document.getElementById('avatarInitials').textContent = name.slice(0, 2).toUpperCase();
  })();

  function doLogout() {
    localStorage.removeItem('rra_operator');
    localStorage.removeItem('rra_op_id');
    localStorage.removeItem('rra_email');
    localStorage.removeItem('rra_token');
    window.location.href = '/dashboard';
  }

  function authHeaders(extra) {
    const h = Object.assign({}, extra || {});
    const token = localStorage.getItem('rra_token');
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function fmtMoney(n) {
    return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }

  // ===== SOURCE BADGES =====
  function sourceBadge(source) {
    const s = source || 'hard_guardrail';
    return `<span class="source-badge ${s}">${s.replaceAll('_', ' ')}</span>`;
  }

  const REASONS = ["insufficient_funds", "bank_timeout", "card_expired", "risk_block", "otp_failed", "network_error", "issuer_down", "max_retries_exceeded"];
  const ACTIONS = ["RETRY_NOW", "RETRY_LATER", "NUDGE", "ESCALATE", "STOP"];

  function optionsHtml(list, selected) {
    return list.map(v => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v.replaceAll('_', ' ')}</option>`).join('');
  }

  // ===== QUEUE =====
  let allRows = [];
  let activeFilter = '';

  function setFilter(source) {
    activeFilter = source;
    document.querySelectorAll('.filter-chip').forEach(el => {
      el.classList.toggle('active', el.dataset.source === source);
    });
    renderQueue();
  }

  async function loadQueue() {
    const list = document.getElementById('queueList');
    list.innerHTML = '<div class="queue-empty">Loading…</div>';

    try {
      const res = await fetch('/review/queue?limit=100', { headers: authHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allRows = await res.json();
    } catch (e) {
      list.innerHTML = `<div class="queue-empty">Couldn't load the queue (${e.message}). <button class="pill-btn" onclick="loadQueue()">Retry</button></div>`;
      return;
    }
    renderQueue();
  }

  function renderQueue() {
    const list = document.getElementById('queueList');
    const rows = activeFilter ? allRows.filter(r => (r.source || 'hard_guardrail') === activeFilter) : allRows;

    document.getElementById('queueCount').textContent = allRows.length + ' pending';

    if (!rows.length) {
      list.innerHTML = allRows.length
        ? '<div class="queue-empty">No cases match this filter.</div>'
        : '<div class="queue-empty">Nothing waiting on a human right now.</div>';
      return;
    }

    const chevron = `<svg class="case-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`;

    list.innerHTML = rows.map(r => {
      const source = r.source || 'hard_guardrail';
      const isFlagged = source === 'fraud_guard' || source === 'circuit_breaker';
      const conf = r.confidence != null ? r.confidence : null;
      // Show 3 decimals so "confidence is below threshold" is visibly true
      // instead of both numbers appearing to round to the same "0.20".
      const confDisplay = conf != null ? conf.toFixed(3) : '—';
      const retryDisplay = r.retry_success_prob != null ? (r.retry_success_prob * 100).toFixed(0) + '%' : '—';

      return `
      <div class="case-card${isFlagged ? ' flagged' : ''}" id="case-${r.id}">
        <div class="case-header" onclick="toggleCard(${r.id})">
          ${chevron}
          <div class="case-header-main">
            <span class="case-txn">${r.txn_id}</span>
            <span class="case-amount">${fmtMoney(r.amount)} · ${r.bank}</span>
            <span class="case-reason-inline"><b>${(r.predicted_reason || '—').replaceAll('_', ' ')}</b></span>
            <span class="case-conf-inline">conf ${confDisplay} · retry ${retryDisplay}</span>
          </div>
          <div class="case-badges">${sourceBadge(source)}</div>
        </div>
        <div class="case-body">
          <div class="case-reasoning">${r.reasoning || ''}</div>
          <div class="case-form">
            <select id="action-${r.id}">${optionsHtml(ACTIONS, 'RETRY_NOW')}</select>
            <select id="reason-${r.id}">${optionsHtml(REASONS, r.predicted_reason)}</select>
            <button onclick="decide(${r.id})" id="btn-${r.id}">Decide</button>
            <span class="toast" id="toast-${r.id}"></span>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function toggleCard(id) {
    const card = document.getElementById('case-' + id);
    if (card) card.classList.toggle('open');
  }

  let allExpanded = false;
  function toggleAllCards() {
    allExpanded = !allExpanded;
    document.querySelectorAll('.case-card').forEach(card => {
      card.classList.toggle('open', allExpanded);
    });
    document.getElementById('toggleAllBtn').textContent = allExpanded ? 'Collapse all' : 'Expand all';
  }

  async function decide(id) {
    const btn = document.getElementById('btn-' + id);
    const toast = document.getElementById('toast-' + id);
    btn.disabled = true;
    toast.textContent = '';
    toast.className = 'toast';

    const operator = localStorage.getItem('rra_operator') || 'Operator';
    const action = document.getElementById('action-' + id).value;
    const corrected_reason = document.getElementById('reason-' + id).value;

    try {
      const res = await fetch(`/review/${id}/decide`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ operator, action, corrected_reason }),
      });
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}${body ? ': ' + body.slice(0, 120) : ''}`);
      }

      // Success — remove from local state and re-render, don't just
      // delete the DOM node, so the filter counts stay correct too.
      allRows = allRows.filter(r => r.id !== id);
      renderQueue();
      loadDriftStats();
    } catch (e) {
      toast.textContent = 'Failed to save: ' + e.message;
      toast.className = 'toast error';
      btn.disabled = false;
    }
  }

  // ===== MODEL DRIFT =====
  async function loadDriftStats() {
    const body = document.getElementById('statsBody');
    const table = document.getElementById('driftTable');
    const tbody = document.getElementById('driftBody');

    let days = [];
    try {
      const res = await fetch('/review/stats', { headers: authHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      days = await res.json();
    } catch (e) {
      body.innerHTML = `<div class="drift-stat-row"><span class="k">Couldn't load stats (${e.message})</span><span class="v"></span></div>`;
      table.style.display = 'none';
      return;
    }

    if (!days.length) {
      body.innerHTML = '<div class="drift-stat-row"><span class="k">No reviewed cases yet</span><span class="v">—</span></div>';
      table.style.display = 'none';
      return;
    }

    const totalReviewed = days.reduce((a, d) => a + d.reviewed, 0);
    const totalOverridden = days.reduce((a, d) => a + d.overridden, 0);
    const overallRate = totalReviewed ? (totalOverridden / totalReviewed) : 0;

    body.innerHTML = `
      <div class="drift-stat-row"><span class="k">Total reviewed</span><span class="v">${totalReviewed}</span></div>
      <div class="drift-stat-row"><span class="k">Total overridden</span><span class="v">${totalOverridden}</span></div>
      <div class="drift-stat-row"><span class="k">Overall override rate</span><span class="v">${(overallRate * 100).toFixed(1)}%</span></div>
    `;

    tbody.innerHTML = days.map(d => `
      <tr>
        <td class="mono">${d.day}</td>
        <td>${d.reviewed}</td>
        <td>${d.overridden}</td>
        <td>
          <div class="drift-bar-track"><div class="drift-bar-fill" style="width:${Math.min(100, d.override_rate * 100)}%"></div></div>
          <span class="mono">${(d.override_rate * 100).toFixed(0)}%</span>
        </td>
      </tr>
    `).join('');
    table.style.display = '';
  }

  // ===== BANDIT LEARNING =====
  async function loadBanditArms() {
    const body = document.getElementById('banditBody');
    const table = document.getElementById('banditTable');
    const rows = document.getElementById('banditBodyRows');

    let arms = [];
    try {
      const res = await fetch('/bandit/arms', { headers: authHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      arms = await res.json();
    } catch (e) {
      body.innerHTML = `<div class="bandit-empty">Couldn't load bandit data (${e.message}).</div>`;
      table.style.display = 'none';
      return;
    }

    if (!arms.length) {
      body.innerHTML = '<div class="bandit-empty">No bandit data yet. Run some cases through <span class="mono">DECISION_MODE=bandit</span> and report outcomes via <span class="mono">POST /outcome/{txn_id}</span> to see the learned posteriors here.</div>';
      table.style.display = 'none';
      return;
    }

    body.innerHTML = '';
    table.style.display = '';

    rows.innerHTML = arms.map(a => {
      const [action, reason, bucket] = (a.arm_key || '').split('|');
      const rate = a.estimated_success_rate != null ? a.estimated_success_rate : 0;
      return `<tr>
        <td><span class="action-pill ${action || ''}">${(action || '—').replaceAll('_', ' ')}</span></td>
        <td>${(reason || '—').replaceAll('_', ' ')}</td>
        <td class="mono">${bucket || '—'}</td>
        <td>
          <div class="bandit-rate-bar">
            <div class="bandit-rate-track"><div class="bandit-rate-fill" style="width:${Math.min(100, rate * 100)}%"></div></div>
            <span class="mono">${(rate * 100).toFixed(0)}%</span>
          </div>
        </td>
        <td class="mono">${a.pulls ?? 0}</td>
      </tr>`;
    }).join('');
  }

  loadQueue();
  loadDriftStats();
  loadBanditArms();
</script>
</body>
</html>
